<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
    
<!-- form: define un formulario, action: este especifica la ruta por la cual se enviarán los datos, method: define el método HTTP de envío, en este caso get -->
    <form action="index.html" method="get">
        <!-- fieldset: organiza en grupos campos del formulario, legend: representa el título -->
        <fieldset>
            <legend>Datos personales by Hamza</legend>
        </fieldset>
    </form>

</body>
</html>
