<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
    
<!-- form: define un formulario, action: este especifica la ruta por la cual se enviarán los datos, method: define el método HTTP de envío, en este caso get -->
    <form action="index.html" method="get">
        <!-- fieldset: organiza en grupos campos del formulario, legend: representa el título -->
        <fieldset>
            <legend>Datos personales by Hamza</legend>

            <!-- label: asocia una descripción con un campo de entrada de formulario, for: asocia la etiqueta con el id del campo -->
            <!-- input: crea controles interactivos que reciben datos del usuario, el nombre y demás, type="text": campo de texto, es para insertar nombre, direcciones de correo, etc... -->
            <!-- placeholder: valor esperado de un campo, required: indica que el campo es obligatorio -->
            <!-- autofocus: se hace foco en este campo, es decir, que el cursor se ponga en este campo, size, caracteres visibles de un input -->
            <!-- maxlength: número máximo de caracteres permitidos, id: identificador único del elemento, name: nombre del dato enviado -->
            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required autofocus size="30" maxlength="40">
            </div>
            
            <!-- type="password": oculta los caracteres introducidos para proteger la contraseña, minlength: número mínimo de caracteres -->
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" minlength="8">
            </div>

            <!-- type="email": campo para correos electrónicos con validación automática -->
            <div>
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <!-- type="tel": campo para números de teléfono, pattern: indica un patrón (en este caso según la tarea indica que son 9 cifras) -->
            <div>
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">
            </div>

            <!-- type="date": permite seleccionar una fecha mediante un calendario desplegable -->
            <div>
                <label for="fecha">Fecha de nacimiento:</label>
                <input type="date" id="fecha" name="fecha">
            </div>

            <!-- type="file": permite al usuario adjuntar o subir archivos desde el dispositivo -->
            <div>
                <label for="foto">Foto:</label>
                <input type="file" id="foto" name="foto">
            </div>

            <!-- value: define un valor inicial del input -->
            <!-- readonly: hace que el campo sea de solo lectura, se puede ver solamente -->
            <div>
                <label for="curso">Curso:</label>
                <input type="text" id="curso" name="curso" value="2026-27" readonly>
            </div>

            <!-- disabled: desactiva completamente el campo, no se puede modificar ni se envía al servidor -->
            <div>
                <label for="centro">Centro:</label>
                <input type="text" id="centro" name="centro" value="IES La Asunción" disabled>
            </div>

        </fieldset>

        <fieldset>
            <legend>Preferencias</legend>
            <!-- input type="radio": permite seleccionar una única opción entre multiples -->
            <div>
                <p>Turno:</p>
                <input type="radio" id="turno-mañana" name="turno" value="mañana">
                <label for="turno-mañana">Mañana</label>
                
                <input type="radio" id="turno-tarde" name="turno" value="tarde">
                <label for="turno-tarde">Tarde</label>
            </div>

            <!-- input type="checkbox": permite seleccionar o deseleccionar varias opciones -->
            <div>
                <p>Intereses:</p>
                <input type="checkbox" id="interes-html" name="intereses" value="html">
                <label for="interes-html">HTML</label>

                <input type="checkbox" id="interes-css" name="intereses" value="css">
                <label for="interes-css">CSS</label>

                <input type="checkbox" id="interes-js" name="intereses" value="js">
                <label for="interes-js">JavaScript</label>
            </div>

            
            <!-- type="number": campo numérico, sirve para ingresar un número con un selector -->
            <div>
                <label for="horas">Horas de estudio:</label>
                <input type="number" id="horas" name="horas" min="0" max="10" step="2">
            </div>

            <!-- type="range": ingresa un número que su valor exacto no es importante, se usa en conjunto con min y max -->
            <div>
                <label for="nivel">Nivel:</label>
                <input type="range" id="nivel" name="nivel" min="1" max="10">
            </div>

            <!-- type="color": selector de color para especificar un color -->
            <div>
                <label for="color">Color favorito:</label>
                <input type="color" id="color" name="color">
            </div>

            <!-- type="time": campo para seleccionar una hora -->
            <div>
                <label for="hora">Hora:</label>
                <input type="time" id="hora" name="hora">
            </div>

            <!-- type="week": selector para elegir una semana específica del año -->
            <div>
                <label for="semana">Semana:</label>
                <input type="week" id="semana" name="semana">
            </div>

            <!-- type="month": selector para elegir un mes y un año -->
            <div>
                <label for="mes">Mes:</label>
                <input type="month" id="mes" name="mes">
            </div>

        </fieldset>
    </form>

</body>
</html>
