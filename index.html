<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
    <!-- form: define un formulario para recopilar datos, action: destino de los datos, method: método de envío -->
    <form action="index.html" method="get">
    <!-- fieldset: aquí se ponen los fieldset poco a poco, estos sirves paran agrupar campos relacionados en un formulario -->
        <fieldset>
             <!-- legend: establece un título para el fieldset -->
            <legend>Datos personales by Hamza</legend>
        </fieldset>
    </form>
    
</body>
</html>
